name: Build Android (APK + AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        run: bash setup.sh
      - name: Análise
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Testes
        run: flutter test 2>&1 | tee test.log
      - name: Build APK
        run: flutter build apk --release 2>&1 | tee build.log
      - name: Build AAB
        run: flutter build appbundle --release 2>&1 | tee -a build.log
      - name: Assinar com a chave da Play Store (se configurada)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "Sem chave: APK/AAB assinados com chave de teste."; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > upload.jks
          AAB=build/app/outputs/bundle/release/app-release.aab
          zip -q -d "$AAB" 'META-INF/*' || true
          jarsigner -keystore upload.jks -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" upload
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks upload.jks --ks-pass env:KEYSTORE_PASS --ks-key-alias upload build/app/outputs/flutter-apk/app-release.apk
          rm -f upload.jks
      - name: Publicar logs no branch logs
        if: always()
        run: |
          mkdir -p logs_out && cp -f *.log logs_out/ 2>/dev/null || true
          cd logs_out && git init -q && git checkout -q -b logs
          git config user.name ci && git config user.email ci@users.noreply.github.com
          echo "${GITHUB_SHA} ${{ job.status }}" > status.txt
          git add -A && git commit -qm "logs ${GITHUB_SHA}" && git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" logs
      - name: Publicar APK/AAB na release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp build/app/outputs/flutter-apk/app-release.apk out/SkyPortTycoon.apk && cp build/app/outputs/bundle/release/app-release.aab out/SkyPortTycoon.aab
          gh release delete latest -y --cleanup-tag || true
          gh release create latest out/SkyPortTycoon.apk out/SkyPortTycoon.aab --title "SkyPort Tycoon (última versão)" --notes "APK para instalar no celular e AAB para a Play Store." --target "${GITHUB_SHA}"
